schema_version: 1

# Стартовый список классов данных (открытый вопрос 2 в 10-contours.md).
data_classes:
  - id: synthetic
    description: Сгенерированные и тестовые данные без реальных источников.
  - id: public
    description: Открытые данные, которые можно свободно хранить и показывать.
  - id: own
    description: Собственные данные владельца, не связанные с работодателем.
  - id: licensed
    description: Данные по лицензии третьей стороны (например, рыночные); условия хранения и показа ограничены.
  - id: employer
    description: Данные и артефакты работодателя.

